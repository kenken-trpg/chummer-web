[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

; --- FastAPI (rules engine) ---
[program:api]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips=127.0.0.1
directory=/app/backend
autorestart=true
startretries=10
stopsignal=INT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- Next.js standalone server ---
[program:web]
command=node server.js
directory=/app/frontend
environment=PORT="3000",HOSTNAME="127.0.0.1",NODE_ENV="production"
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- edge proxy ---
[program:proxy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autorestart=true
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
