[project]
name = "chummer-web-backend"
version = "0.1.0"
description = "FastAPI backend for Chummer Web — an unofficial Shadowrun 5e character builder."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor", ".venv"]

[tool.ruff.lint]
# A pragmatic baseline. Grow this set over time rather than turning on
# everything at once (see docs/architecture.md → "Coding standards").
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced hard
    "B008",  # FastAPI uses `Depends(...)` as a default value by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
# Opt in to the default Ruff formatter (Black-compatible).
docstring-code-format = true

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py"]

[tool.coverage.report]
# Measurement only — deliberately no `fail_under`. The number is here to show
# which engine phases and loaders the suite never enters; pick a floor once
# those gaps are either covered or accepted, rather than freezing today's
# percentage as the bar.
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
files = ["app"]
exclude = ["vendor"]
# Strict across the whole backend (CI + `make check`). The tightening was
# done package by package — `app.engine.*` / `app.improvements.*` reached
# the bar once their two `Any` fountains were typed (the `Ctx` bundles /
# `effects` as `EffectsDict`, and `catalog()` as `CatalogDict`) — and once
# every module held it, the per-module overrides collapsed into the base.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
