[project]
name = "chummer-web-backend"
version = "0.2.1"
description = "FastAPI backend for Chummer Web — an unofficial Shadowrun 5e character builder."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor", ".venv"]

[tool.ruff.lint]
# A pragmatic baseline. Grow this set over time rather than turning on
# everything at once (see docs/architecture.md → "Coding standards").
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    # Stdlib XML parsers (ElementTree / cElementTree / minidom / pulldom).
    # Untrusted input must go through `app.data_loader._xml.parse_untrusted`
    # (defusedxml); a raw parse is only allowed where the file is ours.
    "S313", "S314", "S318", "S319",
]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced hard
    "B008",  # FastAPI uses `Depends(...)` as a default value by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "S313", "S314", "S318", "S319"]
# Offline maintenance tools run by hand on vendored / checked-in files.
"scripts/**" = ["S313", "S314", "S318", "S319"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
# Opt in to the default Ruff formatter (Black-compatible).
docstring-code-format = true

[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py"]

[tool.coverage.report]
# A floor, a couple of points under where the suite actually sits (94%), for
# the same reason as the frontend ratchet in `vitest.config.mts`: it is not a
# target, it catches a *drop* — a loader or engine phase landing with no tests.
# Raise it when the real number moves up; never lower it to make a build pass.
fail_under = 92
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
files = ["app", "scripts"]
exclude = ["vendor"]
# `scripts/` has no `__init__.py` and the tests import it as `scripts.foo`,
# while the scripts themselves run as `python scripts/foo.py` and see each
# other as `foo`. Without this, mypy finds each file under both names and
# refuses to check anything.
explicit_package_bases = true
mypy_path = "."
# Strict across the whole backend, `scripts/` included (CI + `make check`).
# The offline tools there are read by hand and run rarely, which is exactly
# where a wrong annotation survives: the check found `chum5_to_state`
# declaring `list[str]` warnings that are really `list[Notice]`.
# The tightening of `app` was done package by package — `app.engine.*` /
# `app.improvements.*` reached the bar once their two `Any` fountains were
# typed (the `Ctx` bundles / `effects` as `EffectsDict`, and `catalog()` as
# `CatalogDict`) — and once every module held it, the per-module overrides
# collapsed into the base.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
