[project]
name = "chummer-web-backend"
version = "0.1.0"
description = "FastAPI backend for Chummer Web — an unofficial Shadowrun 5e character builder."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor", "saves", ".venv"]

[tool.ruff.lint]
# A pragmatic baseline. Grow this set over time rather than turning on
# everything at once (see docs/architecture.md → "Coding standards").
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced hard
    "B008",  # FastAPI uses `Depends(...)` as a default value by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
# Opt in to the default Ruff formatter (Black-compatible).
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["app"]
exclude = ["vendor", "saves"]
# Clean and blocking (CI + `make check`), but the ruleset is still lenient
# (`check_untyped_defs = false` etc.) — tighten module by module with
# stricter overrides below rather than flipping everything at once.
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

# --- per-module strictness --------------------------------------------------
# app/engine/compute/ is the phased compute() package: every phase is
# `phase(ctx: Ctx) -> None`, the Ctx bundles are TypedDicts and
# tests/test_compute_phases.py pins the seams — so it holds a stricter bar
# than the rest of the (still-lenient) engine. app/improvements/ (the
# <bonus> -> effects pipeline) joined once `effects` became EffectsDict, and
# the self-contained engine leaf modules below were already clean to this
# bar. Grow this list module by module as each one is tightened.
[[tool.mypy.overrides]]
module = [
    "app.engine.compute",
    "app.engine.compute.*",
    "app.engine.bundle_types",
    "app.improvements",
    "app.improvements.*",
    "app.engine.constants",
    "app.engine.formulas",
    "app.engine.karma",
    "app.engine.priority",
    "app.engine.selects",
    "app.engine.skills",
    "app.engine.contacts",
    "app.engine.limits",
    "app.engine.martial_arts",
    "app.engine.dice",
    "app.engine.requirements",
    "app.engine.lookups",
]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
