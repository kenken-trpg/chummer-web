[project]
name = "chummer-web-backend"
version = "0.1.0"
description = "FastAPI backend for Chummer Web — an unofficial Shadowrun 5e character builder."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor", "saves", ".venv"]

[tool.ruff.lint]
# A pragmatic baseline. Grow this set over time rather than turning on
# everything at once (see docs/architecture.md → "Coding standards").
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced hard
    "B008",  # FastAPI uses `Depends(...)` as a default value by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
# Opt in to the default Ruff formatter (Black-compatible).
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["app"]
exclude = ["vendor", "saves"]
# Clean and blocking (CI + `make check`), but the ruleset is still lenient
# (`check_untyped_defs = false` etc.) — tighten module by module with
# stricter overrides below rather than flipping everything at once.
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

# --- per-module strictness --------------------------------------------------
# The strict bar (check_untyped_defs / disallow_untyped_defs /
# disallow_incomplete_defs / warn_return_any) vs. the lenient base ruleset.
# `app.engine.*` reached it once its two Any fountains were typed — the Ctx
# bundles / `effects` (EffectsDict) and `catalog()` (CatalogDict) — plus
# `app.improvements.*` (the <bonus> -> effects pipeline). The rest of the
# repo (store / API / chummer_import|export / data_loader) stays lenient;
# promote a module here once it holds this bar.
[[tool.mypy.overrides]]
module = [
    "app.engine",
    "app.engine.*",
    "app.improvements",
    "app.improvements.*",
    "app.data_loader.catalog_types",
]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
