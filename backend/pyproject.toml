[project]
name = "chummer-web-backend"
version = "0.1.0"
description = "FastAPI backend for Chummer Web — an unofficial Shadowrun 5e character builder."
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor", "saves", ".venv"]

[tool.ruff.lint]
# A pragmatic baseline. Grow this set over time rather than turning on
# everything at once (see docs/architecture.md → "Coding standards").
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced hard
    "B008",  # FastAPI uses `Depends(...)` as a default value by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# B023: the engine's lifestyle-quality helper is a loop-local closure (safe
#   today — defined and called within one iteration; the warning goes away
#   when that block moves to module scope).
# E402: __init__.py keeps a few re-export imports below the top of the file to
#   mark where extracted definitions used to live.
# See docs/architecture.md → "Planned refactors".
"app/engine/__init__.py" = ["B023", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
# Opt in to the default Ruff formatter (Black-compatible).
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["app"]
exclude = ["vendor", "saves"]
# Lenient to start: this codebase is not fully typed yet. Tighten module by
# module by adding stricter overrides below.
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
