# Run the whole app in one container:
#
#   cp .env.example .env      # optional — edit ports / limits
#   make up                   # pulls the published image if available, else builds
#   # or:  docker compose up  # always builds from this checkout (slow first time)
#
# -> http://localhost:8080
services:
  app:
    image: ghcr.io/kenken-trpg/chummer-web:latest
    build:
      context: .
      # args:
      #   CHUMMER_REF: ed77aa3dcbe760064109d9af01ea9b5e4498294c
    # Build from this checkout, every time. The layer cache makes that a few
    # seconds when nothing changed, and it is the only setting that keeps the
    # image and this file in step. `missing` — the obvious choice — reuses
    # whatever image is already on the host no matter how old: an image built
    # before the hardening below lacked the matching Dockerfile change, and
    # caddy then failed to exec with EPERM on every start until the image was
    # rebuilt by hand. The two halves ship together or the container does not
    # come up.
    #
    # The ghcr.io image above is the build tag. It is also where CI publishes,
    # but a GHCR package is private when first created whatever the
    # repository's visibility, so `docker compose pull` fails with
    # `unauthorized` until someone flips it in the package settings. Building
    # is the path that always works; pull explicitly if you have access and
    # want to skip the build.
    pull_policy: build
    ports:
      # loopback only: cloudflared runs on this host and reaches the app here.
      # Publishing on 0.0.0.0 would let anything on the LAN bypass the tunnel.
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      # a single local user doesn't need the public-facing limits
      RATE_LIMIT: "${RATE_LIMIT:-1000/minute}"
      IMPORT_RATE_LIMIT: "${IMPORT_RATE_LIMIT:-200/minute}"
      MAX_REQUEST_BYTES: "${MAX_REQUEST_BYTES:-12582912}"
      CHUM5_MAX_DECOMPRESSED_BYTES: "${CHUM5_MAX_DECOMPRESSED_BYTES:-33554432}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      # 0 locally; set to 2 behind Cloud Run / Fly so rate limiting keys on the
      # real client IP and not a forgeable x-forwarded-for hop.
      TRUSTED_PROXY_HOPS: "${TRUSTED_PROXY_HOPS:-0}"
      # 1 behind Cloudflare (it writes cf-connecting-ip); anywhere else the
      # caller can write that header, so it is ignored
      TRUST_CLOUDFLARE_IP: "${TRUST_CLOUDFLARE_IP:-0}"
      # `json` for one queryable object per line; `text` is what you tail
      LOG_FORMAT: "${LOG_FORMAT:-text}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    # Nothing in the image is written to at run time: the app keeps no state,
    # Caddy's and supervisord's writes go to /tmp (XDG_* point there), and
    # Python is told not to write bytecode. So the filesystem is read-only,
    # with a small tmpfs for those, and the container gives up every Linux
    # capability and the ability to gain one.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      # Next writes its fetch cache here when a page asks for one
      - /app/frontend/.next/cache:rw,noexec,nosuid,size=16m
    restart: unless-stopped
