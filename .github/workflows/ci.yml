name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Chummer game data is not vendored in git (GPL-3.0, large). Cache it
      # between runs, keyed on the fetch script so a new source file busts it.
      - name: Cache Chummer data
        id: chummer-cache
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: chummer-data-${{ hashFiles('backend/scripts/fetch_chummer_data.py') }}

      - if: steps.chummer-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_chummer_data.py

      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: mypy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
