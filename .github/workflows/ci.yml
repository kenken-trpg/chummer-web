name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on a branch, but never a tag build (release images).
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Chummer game data is not vendored in git (GPL-3.0, large). Cache it
      # between runs, keyed on the fetch script so a new source file busts it.
      - name: Cache Chummer data
        id: chummer-cache
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: chummer-data-${{ hashFiles('backend/scripts/fetch_chummer_data.py') }}

      - if: steps.chummer-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_chummer_data.py

      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: mypy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # resolves to the latest 20.x, which clears the >=20.12 floor that
          # `package.json` declares (CompressionStream's `deflate-raw`)
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  # Builds the runtime image on every push/PR; on main and on `v*` tags it also
  # pushes to GHCR (ghcr.io/<owner>/chummer-web). The package inherits the
  # repo's visibility — make the repo public for others to `docker pull` it.
  # Gated on the test jobs so a red commit never publishes `:latest`.
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/chummer-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
