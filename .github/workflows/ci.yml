name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on a branch, but never a tag build (release images).
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Chummer game data is not vendored in git (GPL-3.0, large). Cache it
      # between runs, keyed on the fetch script so a new source file busts it.
      - name: Cache Chummer data
        id: chummer-cache
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: chummer-data-${{ hashFiles('backend/scripts/fetch_chummer_data.py') }}

      - if: steps.chummer-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_chummer_data.py

      - run: ruff check .
      - run: ruff format --check .

      # Coverage on one interpreter only — the numbers are identical across
      # the matrix and it roughly doubles the run. Reported, never gated: see
      # backend/pyproject.toml [tool.coverage.report].
      - run: python -m pytest -q ${{ matrix.python-version == '3.13' && '--cov --cov-report=term' || '' }}

      - run: mypy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # resolves to the latest 20.x, which clears the >=20.12 floor that
          # `package.json` declares (CompressionStream's `deflate-raw`)
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # same deal as the backend: the summary goes in the log, nothing gates on it
      - run: npm run test:coverage
      - run: npm run build

  # A real browser against both halves at once — the one thing the 252 unit
  # tests structurally cannot cover (jsdom has no IndexedDB, and `lib/api` is
  # mocked there). ~3 min including the Chummer data and a Next production
  # build, so it runs on pushes to main and on tags, not on every PR push.
  e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # same key as the backend job, so this usually restores rather than fetches
      - name: Cache Chummer data
        id: chummer-cache
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: chummer-data-${{ hashFiles('backend/scripts/fetch_chummer_data.py') }}

      # a venv at backend/.venv, because that is the interpreter path
      # frontend/playwright.config.ts starts uvicorn from
      - name: Install the backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements.txt

      - if: steps.chummer-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: ./.venv/bin/python scripts/fetch_chummer_data.py

      - working-directory: frontend
        run: npm ci

      - working-directory: frontend
        run: npx playwright install --with-deps chromium

      - working-directory: frontend
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Builds the runtime image on every push/PR; on main and on `v*` tags it also
  # pushes to GHCR (ghcr.io/<owner>/chummer-web). The package inherits the
  # repo's visibility — make the repo public for others to `docker pull` it.
  # Gated on the test jobs so a red commit never publishes `:latest`.
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/chummer-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
