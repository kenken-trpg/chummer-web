name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on a branch, but never a tag build (release images).
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default, whatever the repository-wide token setting is. The
# docker and release jobs widen it for themselves.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # ../scripts/retry.sh: the registry is not a guaranteed-available
      # service, and an empty index page fails the install the same way a bad
      # pin does. See the comment in the script.
      - run: ../scripts/retry.sh pip install -r requirements-dev.txt

      # Chummer game data is not vendored in git (GPL-3.0, large). Cache it
      # between runs, keyed on the fetch script so a new source file busts it.
      - name: Cache Chummer data
        id: chummer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/vendor
          key: chummer-data-${{ hashFiles('backend/scripts/fetch_chummer_data.py') }}

      - if: steps.chummer-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_chummer_data.py

      - run: ruff check .
      - run: ruff format --check .

      # frontend/lib/types/generated.ts is written from app/models/. The
      # pytest run checks it too; this fails earlier and says so plainly.
      - run: python scripts/gen_frontend_types.py --check

      # Coverage on one interpreter only — the numbers are identical across
      # the matrix and it roughly doubles the run. Reported, never gated: see
      # backend/pyproject.toml [tool.coverage.report].
      # `-n auto`: one worker per core. The suite shares nothing on disk
      # between tests, and it roughly halves this step.
      - run: python -m pytest -q -n auto ${{ matrix.python-version == '3.13' && '--cov --cov-report=term' || '' }}

      - run: mypy

  # The one job that is not Linux. Chummer5a is Windows software, so a good
  # share of the people running this locally are on Windows, and nothing else
  # in CI would notice a path or an encoding that only breaks there — Python's
  # default text encoding is the ANSI code page (cp1252 on a US install), not
  # UTF-8, and this repository is full of Japanese. Tests only: ruff, mypy and
  # the generated-types check read the same files on every platform, so running
  # them again here would buy nothing.
  backend-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: ../scripts/retry.sh pip install -r requirements-dev.txt

      # Same key as the Linux job: the fetched tree is plain XML, identical
      # whoever downloaded it.
      - name: Cache Chummer data
        id: chummer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/vendor
          key: chummer-data-${{ hashFiles('backend/scripts/fetch_chummer_data.py') }}

      - if: steps.chummer-cache.outputs.cache-hit != 'true'
        run: python scripts/fetch_chummer_data.py

      - run: python -m pytest -q -n auto

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # resolves to the latest 24.x. The floor is the test toolchain, not
          # the app: jsdom wants ^22.22.2 || ^24.15.0 and vitest ^22.12 || ^24,
          # both of which need an undici newer than any Node 20 ships.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # no install hooks: see the Dockerfile
      - run: ../scripts/retry.sh npm ci --ignore-scripts

      # Same cache the e2e job keeps, under its own key so the two jobs cannot
      # race each other writing it: most of what `next build` costs is the
      # compile cache, and a run that only touched tests reuses all of it.
      - name: Cache Next build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: next-build-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx', 'frontend/**/*.css') }}
          restore-keys: next-build-${{ hashFiles('frontend/package-lock.json') }}-

      # Instrumenting costs roughly a quarter of the run (17s -> 22s locally),
      # so the numbers are measured on main and a pull request runs the plain
      # suite. The trade is deliberate and worth knowing: vitest.config.ts sets
      # coverage *thresholds*, so a change that drops coverage now fails this
      # job on the merge commit rather than on the pull request.
      - run: npm run ${{ github.event_name == 'push' && 'test:coverage' || 'test' }}
      - run: npm run build

  # typecheck, lint and prettier, away from the tests. They read the sources
  # and nothing else — no jsdom, no build — so they have no reason to queue
  # behind a minute of vitest, and on a failure the log is the failure.
  frontend-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: ../scripts/retry.sh npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  # The frontend half of the Windows question (`backend-windows` is the other).
  # Node is far more portable than Python here, so this is looking for a
  # narrower class of thing: a path joined with a literal "/", a case-only
  # import that a case-insensitive filesystem forgives, a tool that reads CRLF
  # where the Linux run read LF. `format:check` is the sharp one — prettier is
  # configured for LF endings, so it fails outright on a checkout that arrived
  # as CRLF, which makes this job a live test of `.gitattributes` as well.
  #
  # `npm run test`, not `test:coverage`: the numbers are identical to the Linux
  # run and nothing gates on them. No typecheck and no lint either — tsc and
  # eslint read the same sources on every platform, so `frontend-static` has
  # already answered for them; what is left here is the platform-sensitive
  # half: prettier's line endings, the test suite, and the build.
  frontend-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: ../scripts/retry.sh npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  # A real browser against both halves at once — the one thing the 252 unit
  # tests structurally cannot cover (jsdom has no IndexedDB, and `lib/api` is
  # mocked there). ~3 min including the Chummer data and a Next production
  # build. It used to skip pull requests to save that, which meant #23 went in
  # all-green and broke main on the merge commit: a check that only runs after
  # the merge cannot gate the merge. The three minutes buy the gate.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # same key as the backend job, so this usually restores rather than fetches
      - name: Cache Chummer data
        id: chummer-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/vendor
          key: chummer-data-${{ hashFiles('backend/scripts/fetch_chummer_data.py') }}

      # a venv at backend/.venv, because that is the interpreter path
      # frontend/playwright.config.ts starts uvicorn from
      - name: Install the backend
        run: |
          python -m venv backend/.venv
          scripts/retry.sh backend/.venv/bin/pip install -r backend/requirements.txt

      - if: steps.chummer-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: ./.venv/bin/python scripts/fetch_chummer_data.py

      - working-directory: frontend
        run: ../scripts/retry.sh npm ci --ignore-scripts

      # The browser is ~130MB downloaded on every run otherwise. Keyed on the
      # lockfile: playwright pins one browser build per version, and mixing a
      # cached browser with a different playwright is exactly what it refuses
      # to run. The apt side of `--with-deps` is not cacheable and stays.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - working-directory: frontend
        run: ../scripts/retry.sh npx playwright install-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: ../scripts/retry.sh npx playwright install chromium

      # playwright.config.ts runs `next build` before any test; its compile
      # cache is most of what makes that slow
      - name: Cache Next build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: next-e2e-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx', 'frontend/**/*.css') }}
          restore-keys: next-e2e-${{ hashFiles('frontend/package-lock.json') }}-

      # the Chummer save e2e/chummer-import.spec.ts pins by commit and sha256
      - name: Cache E2E fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/e2e/.fixtures
          key: e2e-fixtures-${{ hashFiles('frontend/e2e/chummer-import.spec.ts') }}

      - working-directory: frontend
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Builds the runtime image on every push/PR, one job per architecture, and
  # smoke-tests each. Nothing is published from here: `docker-push` below is
  # gated on the tests and pushes the layers this job left in the cache, so a
  # red commit publishes nothing and a tag that cannot start is never the tag
  # anyone pulls. The package inherits nothing from the repo — it is private
  # until flipped once in the package settings.
  #
  # Two native runners rather than one runner with QEMU: `next build` and
  # `npm ci` under emulation take tens of minutes, and arm64 runners are free
  # for public repositories. Deliberately ungated: the image build reads the
  # same sources the tests do, so making it wait for them only lengthened the
  # run — it is the slowest job and used to start last.
  docker-build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On a pull request, build only when something only the image reads
      # changed. The application code the image copies is already built and
      # run by the tests and by e2e (a Next production build); what they never
      # touch is the Dockerfile, the runtime requirements, the deploy files and
      # the data fetch. The push to main always builds — `docker-push` needs
      # this job's layers in the cache — so a break the filter lets through
      # still turns main red on the merge commit.
      - name: Does this change touch the image?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if echo "$changed" | grep -Eq '^(Dockerfile|\.dockerignore|compose\.ya?ml|deploy/|scripts/retry\.sh|backend/requirements\.txt|backend/scripts/fetch_chummer_data\.py|frontend/package(-lock)?\.json|frontend/next\.config\.|\.github/workflows/ci\.yml)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "nothing the image alone reads changed; skipping the build"
          fi

      - if: steps.scope.outputs.build == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - if: steps.scope.outputs.build == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/chummer-web

      # Native, single-platform, into the local daemon — `load` cannot take a
      # manifest list, and this is the image the smoke test starts.
      - if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: local
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: chummer-web:ci
          labels: ${{ steps.meta.outputs.labels }}
          # one scope per architecture: a shared one has the two jobs
          # overwriting each other's cache with layers the other cannot use
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Start it the way compose.yaml does — read-only root, no capabilities,
      # no way to gain one — so a change that needs to write somewhere new
      # fails here rather than on someone's host.
      - if: steps.scope.outputs.build == 'true'
        name: Smoke-test the image, locked down
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            --read-only \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/frontend/.next/cache:rw,noexec,nosuid,size=16m \
            -p 8080:8080 chummer-web:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then
              echo "health ok after ${i}s"
              curl -fsS -o /dev/null http://127.0.0.1:8080/
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "the container never became healthy:"
          docker logs smoke
          exit 1

  # The push, gated on the tests. It is a separate job so that the build above
  # can start alongside them instead of after them: by the time this runs every
  # layer is in the gha cache, so it re-resolves the same digest in seconds
  # rather than building anything — the image published is the one the smoke
  # test started, and a red commit still publishes nothing.
  docker-push:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    needs: [backend, frontend, frontend-static, docker-build]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/chummer-web

      # Pushed anonymously by digest; `docker-manifest` gives the digests their
      # tags. Cache-read only: this job must never be what warms the cache.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/chummer-web,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}

      - name: Hand the digest to the manifest job
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One check with a fixed name over the whole matrix. A matrix job's checks are
  # named after its parameters — `docker (linux/arm64, ubuntu-24.04-arm)` — so a
  # branch rule naming `docker` would stop matching anything the moment the
  # matrix changes, and block every PR. This job is what the rule watches.
  # `always()` so a cancelled or skipped leg fails it rather than passing by
  # omission.
  docker:
    if: always()
    runs-on: ubuntu-latest
    needs: [docker-build, docker-push]
    steps:
      # docker-push is skipped on pull requests, which is a pass here — what it
      # must never be is failed or cancelled.
      - name: Every architecture built, started and (off a PR) pushed
        run: |
          echo "docker-build: ${{ needs.docker-build.result }}"
          echo "docker-push: ${{ needs.docker-push.result }}"
          test "${{ needs.docker-build.result }}" = "success"
          case "${{ needs.docker-push.result }}" in
            success | skipped) ;;
            *) exit 1 ;;
          esac

  # The tags (`latest`, semver, short sha) are created here, once, pointing at
  # a manifest list over both per-architecture digests. Nothing is tagged until
  # every architecture has built and started.
  docker-manifest:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: docker-push
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/chummer-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            # a self-hoster who wants patches but not surprises pins :0.2
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          image=ghcr.io/${{ github.repository_owner }}/chummer-web
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${image}@sha256:%s " *)
          docker buildx imagetools inspect "${image}:${VERSION}"
        env:
          VERSION: ${{ steps.meta.outputs.version }}

  # What the published image is, and that it came from here. Two separate
  # claims, both attached to the manifest list rather than to a per-architecture
  # digest: the list is what `docker pull` resolves, and it is the only digest a
  # self-hoster ever sees.
  #
  # Signing is keyless — the `id-token: write` below lets cosign exchange the
  # job's OIDC token for a short-lived Fulcio certificate, so there is no key to
  # store or rotate, and the certificate records the workflow, the ref and the
  # commit that signed. Verify with:
  #
  #   cosign verify ghcr.io/<owner>/chummer-web:latest \
  #     --certificate-identity-regexp '^https://github.com/<owner>/chummer-web/' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  #
  # A separate job rather than `sbom:`/`provenance:` on the build: those attach
  # attestations to what that step pushes, and this pipeline pushes anonymous
  # per-architecture digests which `docker-manifest` then gathers into a list.
  # Attestations made before the list exists are attached to the wrong thing.
  docker-attest:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: docker-manifest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: OIDC token -> Fulcio certificate
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # By digest from here on. A tag can move between the sign and the attest;
      # a digest is the image, so both claims land on the same bytes.
      - name: Resolve the manifest list's digest
        id: image
        run: |
          set -euo pipefail
          image=ghcr.io/${{ github.repository_owner }}/chummer-web
          tag=$([ "${GITHUB_REF_TYPE}" = tag ] && echo "${GITHUB_REF_NAME#v}" || echo latest)
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "${image}:${tag}" | tr -d '"')
          echo "ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "signing ${image}@${digest} (from :${tag})"

      - name: Sign it
        run: cosign sign --yes "${{ steps.image.outputs.ref }}"

      # Syft reads the image, so the SBOM lists what is actually in the layers
      # rather than what the lockfiles asked for. SPDX because `cosign attest`
      # has a predicate type for it and `pip-audit` / `grype` both read it.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest the SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ steps.image.outputs.ref }}"

      # Keep a copy on the run as well: `cosign download attestation` needs
      # cosign, and a self-hoster comparing two releases wants the file.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx-json
          path: sbom.spdx.json
          if-no-files-found: error

  # A `v*` tag becomes a GitHub Release, with the CHANGELOG section as its
  # ─── the one check branch protection has to know about ──────────────────────
  #
  # Required checks are matched by *name*, in a setting that lives outside the
  # repository — so a job nobody listed there is not a gate, and a renamed job
  # leaves behind a required check that can never report and blocks every PR.
  # #276 went in with `backend-windows` red for the first reason: only
  # `frontend`, `backend (3.13)` and `e2e` were required. The run that caught it
  # had already handed the PR to auto-merge, and auto-merge waits for the
  # required checks, not for every check.
  #
  # So there is one required check and it is defined here. Adding a job means
  # adding it to `needs` — in a pull request, reviewed like any other change,
  # instead of in a settings page that no diff ever shows.
  #
  # `if: always()` because a failure upstream would otherwise skip this job, and
  # a skipped required check never reports at all: the merge would wait forever
  # rather than fail. `skipped` is not accepted for any of these; they all run
  # on every event. `docker` is itself the aggregate that tolerates
  # `docker-push` being skipped on a pull request, which is why it, and not
  # `docker-build`, is the one named here.
  #
  # `docker-build` and `docker-push` are covered through `docker`.
  # `docker-manifest`, `docker-attest` and `release` are deliberately absent:
  # they never run on a pull request, so they cannot gate one, and gating the
  # push to main on them would only block the next merge on a registry problem.
  #
  # CodeQL runs in its own workflow and cannot be a `needs` of this one. If it
  # should gate too, it is required by name — the one exception this leaves.
  ci-ok:
    if: always()
    runs-on: ubuntu-latest
    needs: [backend, backend-windows, frontend, frontend-static, frontend-windows, e2e, docker]
    steps:
      - name: Every job reported success
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "  \(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "not green:"
            echo "$bad"
            exit 1
          fi
          echo "all green: $(echo "$RESULTS" | jq -r 'keys | join(", ")')"

  # notes. `needs: docker-attest` (which needs `docker-manifest`) so the release
  # never points at an image that is not in the registry yet, or at one nobody
  # has signed — the version tag only exists once the manifest job has created
  # it. A tag build is never cancelled (see `concurrency`).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [backend, frontend, frontend-static, docker-attest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails the release if the tag has no CHANGELOG section, or if the
      # version the API reports at /docs was never bumped to match.
      - name: Build the notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release_notes.py "$version" > "$RUNNER_TEMP/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
