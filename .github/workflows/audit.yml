name: Audit

# Known vulnerabilities in what the running app is built from. Dependabot
# already opens PRs for new versions; this is the other half — a red check
# when a version we resolve to today has a published advisory.
#
# Its own workflow rather than a job in ci.yml for the schedule: an advisory
# lands without any commit here, and a scheduled run of ci.yml would also push
# a `:latest` image nobody asked for.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays, after dependabot's weekly run
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install pip-audit==2.10.1

      # Runtime requirements only: requirements-dev.txt (pytest, ruff, mypy)
      # never reaches the image. The `>=` pins resolve to what a fresh
      # install — and so the next image build — would get.
      - run: pip-audit -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Against the lockfile, production dependencies only: the test and lint
      # toolchain never ships. High and critical fail the check; a moderate
      # still prints here without blocking every PR until upstream moves.
      - run: npm audit --omit=dev --audit-level=high
