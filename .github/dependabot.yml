version: 2
updates:
  # Actions are pinned by commit SHA with the release tag in a trailing comment
  # (a moved or hijacked tag can't swap the code under us). Dependabot bumps the
  # SHA and the comment together — weekly PRs when a new patch/minor or major is
  # out. Worth taking promptly: GitHub retires the Node runtime old action
  # majors ship with, and stale ones get force-migrated.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # frontend/package.json — loose `^` ranges; batch the noise into one PR.
  #
  # Minors and patches only. Grouping majors as well produced a single PR
  # carrying Next 15->16, TypeScript 5->7, ESLint 9->10, jsdom 29->30 and
  # @types/node 22->26 — five migrations that cannot be reviewed, tested or
  # reverted as a unit, so the PR was unmergeable from the moment it opened.
  # Majors now arrive one per PR, which is the only shape in which a breaking
  # change is worth looking at.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # backend/requirements*.txt — loose `>=` pins. Same split as npm: a major
  # of pydantic or mypy is a piece of work, not a line in a batch.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      pip:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The two Cloudflare Workers in `deploy/`. They were covered by nothing:
  # a security advisory still reaches them (that is how #441 arrived), but a
  # routine version bump did not, so the two drifted apart on their own —
  # `cloudflare-proxy` sat on a wrangler that `npm audit` reported as one high
  # and two moderate advisories, which the other had already been bumped past.
  #
  # Same minor/patch split as the two above, and the same reason. Separate
  # entries rather than one: they have their own lockfiles and are deployed
  # separately, so a bump to one should not be reviewed as a bump to both.
  - package-ecosystem: npm
    directory: /deploy/cloudflare
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /deploy/cloudflare-proxy
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The Dockerfile's base images. They are pinned by digest — `python:3.12-slim-
  # bookworm@sha256:…` — which is what makes a build reproducible and is also
  # why nothing moves them: a digest never floats to a rebuilt tag, so without
  # this entry the runtime image keeps whatever glibc, openssl and libxml2 it
  # was built with until somebody edits the line by hand.
  #
  # Nothing else here covers that layer. `pip-audit` reads
  # backend/requirements.txt and `npm audit` reads frontend/package-lock.json
  # (both in audit.yml); an advisory in a Debian package is in neither file.
  # docs/deploy.md › Before going public asks for the image to be kept fresh.
  # This is the half of that a bot can do.
  #
  # Ungrouped, unlike the four above: the four `FROM`s are node, a python build
  # stage and two python runtime stages, and a bump to the Python the image
  # ships is not the same review as a bump to the Node that builds the frontend.
  #
  # `COPY --from=caddy:2@sha256:…` (Dockerfile:77) may or may not be picked up —
  # Dependabot's Docker support is written around `FROM`. If Caddy turns out to
  # be untouched by this, it stays a manual bump; check after the first run.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
