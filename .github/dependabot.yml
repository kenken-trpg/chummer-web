version: 2
updates:
  # Pinned action majors (actions/checkout@v7, docker/*@v4…) — weekly PRs when
  # a new patch/minor or major is out. Worth taking promptly: GitHub retires the
  # Node runtime old action majors ship with, and stale ones get force-migrated.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # frontend/package.json — loose `^` ranges; batch the noise into one PR.
  #
  # Minors and patches only. Grouping majors as well produced a single PR
  # carrying Next 15->16, TypeScript 5->7, ESLint 9->10, jsdom 29->30 and
  # @types/node 22->26 — five migrations that cannot be reviewed, tested or
  # reverted as a unit, so the PR was unmergeable from the moment it opened.
  # Majors now arrive one per PR, which is the only shape in which a breaking
  # change is worth looking at.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # backend/requirements*.txt — loose `>=` pins. Same split as npm: a major
  # of pydantic or mypy is a piece of work, not a line in a batch.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      pip:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
