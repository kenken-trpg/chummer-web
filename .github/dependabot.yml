version: 2

# Routine maintenance is one monthly PR across the whole repository, including
# major updates. If a batch needs migration work, fix or split that batch rather
# than opening a separate routine PR for every dependency in advance.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    commit-message:
      prefix: build(deps)

updates:
  # Keep Actions pinned by SHA; Dependabot updates the SHA and tag comment.
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # Batch the Workers' independent npm lockfiles with the frontend. No semver
  # filter: majors must not escape into individual version-update PRs.
  - package-ecosystem: npm
    directories:
      - /frontend
      - /deploy/cloudflare
      - /deploy/cloudflare-proxy
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      # eslint-plugin-jsx-a11y supports only ESLint <=9. Revisit its peer range
      # before allowing an upgrade that npm cannot install.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # Rebuilt base-image digests carry OS fixes; track them together. Runtime
  # migrations stay deliberate: Node keeps its major and Python its major/minor.
  # COPY --from=caddy remains manual: only FROM updates were detected here.
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

# Security updates use their own groups above and do not wait for the monthly
# version-update schedule. They are grouped within GitHub's supported scope,
# not promised to be one cross-ecosystem PR. Keep security updates enabled in
# repository settings; the monthly PR limit does not cap security PRs.
